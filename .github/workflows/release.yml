name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    name: Compute release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        env:
          BUMP: ${{ github.event.inputs.bump }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          BUMP_TYPE="${BUMP:-patch}"

          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
            case "$BUMP_TYPE" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
              *) echo "::error::Unsupported bump: ${BUMP_TYPE}"; exit 1 ;;
            esac
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

  build:
    name: Build, package and release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared contract projects
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/XBDJ504764827/sws2-cs2menus.git sws2-cs2menus
          git clone --depth 1 --branch main https://github.com/XBDJ504764827/sws2-cs2mapmanager.git sws2-cs2mapmanager

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/*.csproj"

      - name: Restore dependencies
        run: dotnet restore sws2-cs2rockthevote.csproj

      - name: Verify formatting and analyzers
        run: dotnet format sws2-cs2rockthevote.csproj --verify-no-changes --no-restore --severity warn

      - name: Inject release version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s/(public const string Version = )\"[^\"]*\";/\1\"${VERSION}\";/" src/VersionInfo.cs

      - name: Build (warnings are errors)
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: dotnet build sws2-cs2rockthevote.csproj -c Release --no-restore -warnaserror -p:Version="${VERSION}"

      - name: Publish package
        run: dotnet publish sws2-cs2rockthevote.csproj -c Release --no-restore --no-build

      - name: Rename package
        id: package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          SOURCE="build/sws2-cs2rockthevote.zip"
          if [ ! -f "$SOURCE" ]; then
            SOURCE="sws2-cs2rockthevote.zip"
          fi
          TARGET="build/sws2-cs2rockthevote-v${VERSION}.zip"
          test -f "$SOURCE"
          mv "$SOURCE" "$TARGET"
          echo "path=${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: SWS2 CS2 Rock The Vote v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.package.outputs.path }}
